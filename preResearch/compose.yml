services:
  youtube-capture:
    build: .
    image: youtube-capture
    volumes:
      - ./output:/output
    environment:
      YOUTUBE_URL: ${YOUTUBE_URL:?YOUTUBE_URL is required}
    restart: "no"

  web-viewer:
    image: nginx:alpine
    volumes:
      - ./output:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    restart: unless-stopped
